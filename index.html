3<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trap Kaline Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:white;font-family:Arial;display:flex;flex-direction:column;align-items:center;height:100vh;overflow:hidden}
h1{margin:12px 0 5px;font-size:26px}
#topBar{display:flex;gap:12px;margin-bottom:8px;align-items:center}
#score{font-size:18px}
#musicBtn{background:#ff0055;color:white;border:none;padding:7px 14px;border-radius:20px;font-weight:bold}
#gameBox{border:3px solid white;width:95vw;max-width:400px;height:62vh;position:relative;background:#111;overflow:hidden;border-radius:12px}
.enemy{position:absolute;width:30px;height:30px;background:red;border-radius:6px}
#trapBtn{position:absolute;bottom:10px;left:10px;background:#00e5ff;color:black;border:none;padding:9px 20px;font-weight:bold;border-radius:6px;font-size:16px}
#restart{margin-top:12px;padding:12px 35px;font-size:18px;border-radius:12px;border:none;font-weight:bold}
</style>
</head>
<body>
<h1>🎮 Trap Kaline Game</h1>
<div id="topBar">
<div id="score">Score: 0</div>
<button id="musicBtn">🎵 PLAY BEAT</button>
</div>
<div id="gameBox"><button id="trapBtn">TRAP</button></div>
<button id="restart">Restart</button>

<script>
let score=0,enemies=[],musicOn=false,audioCtx,beatInterval;
const box=document.getElementById('gameBox');
const scoreEl=document.getElementById('score');

function getCtx(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }

function popSound(){
  const ctx=getCtx(); const o=ctx.createOscillator(); const g=ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.frequency.setValueAtTime(800,ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(120,ctx.currentTime+0.15);
  g.gain.setValueAtTime(0.9,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.15);
  o.start(); o.stop(ctx.currentTime+0.15);
}
function kick(){
  const ctx=getCtx(); const o=ctx.createOscillator(); const g=ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.frequency.setValueAtTime(150,ctx.currentTime); o.frequency.exponentialRampToValueAtTime(40,ctx.currentTime+0.15);
  g.gain.setValueAtTime(1,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.15);
  o.start(); o.stop(ctx.currentTime+0.15);
}
function hihat(){
  const ctx=getCtx(); const o=ctx.createOscillator(); const g=ctx.createGain();
  o.type='square'; o.connect(g); g.connect(ctx.destination);
  o.frequency.setValueAtTime(8000,ctx.currentTime);
  g.gain.setValueAtTime(0.15,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.05);
  o.start(); o.stop(ctx.currentTime+0.05);
}

let beatStep=0;
function playBeatLoop(){
  if(beatStep%4===0) kick();
  if(beatStep%2===1) hihat();
  beatStep=(beatStep+1)%8;
}

document.getElementById('musicBtn').onclick=()=>{
  getCtx();
  if(!musicOn){
    beatInterval=setInterval(playBeatLoop,180);
    musicOn=true; document.getElementById('musicBtn').textContent="⏸️ STOP BEAT";
    document.getElementById('musicBtn').style.background="#00ff88"; document.getElementById('musicBtn').style.color="#000";
  } else {
    clearInterval(beatInterval); musicOn=false;
    document.getElementById('musicBtn').textContent="🎵 PLAY BEAT";
    document.getElementById('musicBtn').style.background="#ff0055"; document.getElementById('musicBtn').style.color="#fff";
  }
};

function spawnEnemy(){
  const e=document.createElement('div'); e.className='enemy';
  e.style.left=Math.random()*(box.clientWidth-30)+'px'; e.style.top='0px';
  box.appendChild(e); enemies.push({el:e,y:0,speed:2+Math.random()*3});
}
function update(){
  enemies.forEach((en,i)=>{
    en.y+=en.speed; en.el.style.top=en.y+'px';
    if(en.y>box.clientHeight-30){ try{box.removeChild(en.el)}catch{} enemies.splice(i,1); }
  });
  requestAnimationFrame(update);
}
function doTrap(){
  popSound(); if(navigator.vibrate) navigator.vibrate(30);
  if(!musicOn && audioCtx) { /* keep beat off unless user pressed */ }
  enemies.forEach((en,i)=>{
    if(en.y>box.clientHeight-130){ try{box.removeChild(en.el)}catch{} enemies.splice(i,1); score++; scoreEl.textContent='Score: '+score; }
  });
}
document.getElementById('trapBtn').addEventListener('touchstart',e=>{e.preventDefault();doTrap()});
document.getElementById('trapBtn').addEventListener('click',doTrap);
document.getElementById('restart').onclick=()=>{ enemies.forEach(e=>{try{box.removeChild(e.el)}catch{}}); enemies=[]; score=0; scoreEl.textContent='Score: 0'; };
setInterval(spawnEnemy,650); update();
</script>
</body>
</html>
