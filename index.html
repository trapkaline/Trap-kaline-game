<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trap Kaline Game</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff0055">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/138/138817.png">
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;text-align:center}
#game{width:100vw;height:65vh;background:#111;border:2px solid red;position:relative;overflow:hidden}
.block{position:absolute;width:50px;height:50px;background:red;top:0;border-radius:8px}
#score{font-size:22px;padding:8px}
#high{color:gold;font-size:18px}
button{padding:14px 28px;margin:6px;border:none;border-radius:12px;font-weight:bold;font-size:18px}
#trap{background:red;color:white}
#beat{background:yellow;color:black}
#support{background:#00c853;color:white}
</style>
</head>
<body>
<h1>🎮 TRAP KALINE 🇸🇸</h1>
<div id="score">Score: 0</div>
<div id="high">High Score: 0</div>
<div id="game"></div>
<button id="trap" onclick="trap()">TRAP 💥</button>
<button id="beat" onclick="beat()">🎵 PLAY BEAT</button>
<button id="support" onclick="window.open('https://wa.me/211920394480?text=Bro%20I%20love%20Trap%20Kaline%20Game%20🇸🇸','_blank')">💰 SUPPORT 0920394480</button>
<script>
let s=0,hs=localStorage.getItem('trapHS')||0,blocks=[],audio=null;
document.getElementById('high').innerHTML='High Score: '+hs;
function beat(){
 if(!audio){audio=new Audio('https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a650a6.mp3?filename=hip-hop-rock-beats-118000.mp3');audio.loop=true;}
 if(audio.paused){audio.play();event.target.innerText='⏸️ STOP';}else{audio.pause();event.target.innerText='🎵 PLAY BEAT';}
}
function addBlock(){
 let d=document.createElement('div');d.className='block';
 d.style.left=Math.random()*(innerWidth-60)+'px';
 document.getElementById('game').appendChild(d);
 blocks.push({e:d,y:0,v:2+Math.random()*4+s*0.08});
}
function trap(){
 if(!blocks.length)return;
 let b=blocks.pop();
 if(b.y>100){b.e.remove();s++;document.getElementById('score').innerText='Score: '+s;
 if(s>hs){hs=s;localStorage.setItem('trapHS',hs);document.getElementById('high').innerText='High Score: '+hs+' 🔥 NEW!';}
 if(navigator.vibrate)navigator.vibrate(40);
 }else blocks.push(b);
}
setInterval(addBlock,750);
function loop(){
 for(let i=blocks.length-1;i>=0;i--){
  let b=blocks[i];b.y+=b.v;b.e.style.top=b.y+'px';
  if(b.y>innerHeight){b.e.remove();blocks.splice(i,1);s=0;document.getElementById('score').innerText='Score: 0 - MISSED!';}
 }
 requestAnimationFrame(loop);
}
loop();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
