<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trap Kaline Game</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      margin: 12px 0 5px;
    }

    #score {
      font-size: 22px;
      margin-bottom: 8px;
    }

    canvas {
      display: block;
      margin: auto;
      background: #222;
      border: 2px solid white;
      max-width: 95vw;
      height: auto;
    }

    button {
      margin-top: 12px;
      padding: 12px 25px;
      font-size: 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>🎮 Trap Kaline Game</h1>
<div id="score">Score: 0</div>

<canvas id="game" width="360" height="550"></canvas>

<button onclick="restartGame()">Restart</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {
  x: 150,
  y: 490,
  width: 60,
  height: 25,
  speed: 7
};

let star = {
  x: Math.random() * 330,
  y: -20,
  size: 20,
  speed: 4
};

let score = 0;
let gameOver = false;

let keys = {};

document.addEventListener("keydown", e => {
  keys[e.key] = true;
});

document.addEventListener("keyup", e => {
  keys[e.key] = false;
});

canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  player.x = (touch.clientX - rect.left) * canvas.width / rect.width - player.width / 2;
});

function drawPlayer() {
  ctx.fillStyle = "#00ffff";
  ctx.fillRect(player.x, player.y, player.width, player.height);

  ctx.fillStyle = "white";
  ctx.font = "14px Arial";
  ctx.fillText("TRAP", player.x + 10, player.y + 17);
}

function drawStar() {
  ctx.fillStyle = "#ffff00";
  ctx.beginPath();
  ctx.arc(star.x, star.y, star.size / 2, 0, Math.PI * 2);
  ctx.fill();
}

function update() {
  if (gameOver) return;

  if (keys["ArrowLeft"] || keys["a"]) {
    player.x -= player.speed;
  }

  if (keys["ArrowRight"] || keys["d"]) {
    player.x += player.speed;
  }

  if (player.x < 0) player.x = 0;
  if (player.x + player.width > canvas.width) {
    player.x = canvas.width - player.width;
  }

  star.y += star.speed;

  if (
    star.y + star.size / 2 > player.y &&
    star.x > player.x &&
    star.x < player.x + player.width
  ) {
    score++;
    document.getElementById("score").textContent = "Score: " + score;

    star.y = -20;
    star.x = Math.random() * (canvas.width - 20);
    star.speed += 0.3;
  }

  if (star.y > canvas.height) {
    gameOver = true;
    alert("Game Over! Your score: " + score);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawPlayer();
  drawStar();
  update();

  requestAnimationFrame(draw);
}

function restartGame() {
  score = 0;
  gameOver = false;
  star.y = -20;
  star.x = Math.random() * 330;
  star.speed = 4;

  document.getElementById("score").textContent = "Score: 0";
}

draw();
</script>

</body>
</html>
